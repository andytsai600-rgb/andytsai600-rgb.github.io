<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邦導的天空-數位教學教室 | 堅持進化 靜待開花</title>
  <meta name="description" content="邦導的數位教學入口：收錄教學工具與成果，邊做邊學持續更新。">

  <!-- 分享預覽（LINE、Facebook 等貼上網址時顯示的標題與簡介） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="邦導的天空">
  <meta property="og:title" content="邦導的天空－數位教學教室">
  <meta property="og:description" content="邦導的數位教學入口：收錄教學工具與成果，邊做邊學持續更新。">
  <meta property="og:url" content="https://andytsai600-rgb.github.io/">
  <meta property="og:locale" content="zh_TW">

  <!-- 網頁圖示：用 emoji 做成，不需要圖檔 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'serif'],
          },
          colors: {
            skybrand: {
              50: '#F0F9FF',
              100: '#E0F2FE',
              200: '#BAE6FD',
              400: '#38BDF8',
              500: '#0EA5E9',
              600: '#0284C7',
              700: '#0369A1',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 天空晨曦漸層背景 */
    .sky-bg {
      background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 35%, #FFFFFF 100%);
      min-height: 100vh;
    }
    .card-hover {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(2, 132, 199, 0.1), 0 8px 10px -6px rgba(2, 132, 199, 0.05);
    }
  </style>
</head>
<body class="sky-bg text-slate-800 antialiased font-sans flex flex-col justify-between selection:bg-skybrand-200">

  <!-- 頂部微型狀態條 -->
  <div class="w-full bg-skybrand-600/10 border-b border-skybrand-200/50 py-1.5 px-4 text-center text-xs text-skybrand-700 font-medium tracking-wide">
    ☀️ 歡迎來到邦導的天空 • 邊做邊學 持續更新中
  </div>

  <!-- 主內容容器 -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-20 flex-1 flex flex-col items-center">
    
    <!-- 核心 Hero 標題區 -->
    <header class="text-center max-w-2xl mx-auto mb-14">
      
      <!-- 標誌性天空小徽章 -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/90 border border-skybrand-200 shadow-sm text-skybrand-700 text-xs sm:text-sm font-semibold mb-6 backdrop-blur-sm">
        <span class="text-base">🌤️</span>
        <span>數位教學 AI工具</span>
      </div>

      <!-- 標題 -->
      <h1 class="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight leading-tight">
        邦導的天空<span class="text-skybrand-600 font-serif font-normal text-2xl sm:text-4xl">－</span><span class="text-skybrand-600">數位教學教室</span>
      </h1>

      <!-- 副標：堅持進化 靜待開花 -->
      <div class="mt-4 flex items-center justify-center gap-3">
        <div class="h-[1px] w-8 sm:w-12 bg-skybrand-300"></div>
        <p class="text-lg sm:text-2xl font-serif font-semibold text-slate-700 tracking-widest">
          堅持進化 <span class="text-amber-600 font-bold">靜待開花</span>
        </p>
        <div class="h-[1px] w-8 sm:w-12 bg-skybrand-300"></div>
      </div>

      <p class="mt-4 text-xs sm:text-sm text-slate-500 max-w-md mx-auto leading-relaxed">
        終一生 擇一事
      </p>

    </header>

    <!-- 成果卡片網格：內容由 works.js 提供，由下方腳本產生 -->
    <section id="works" class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl"></section>

    <!-- 底部占位卡片：持續進化中 -->
    <div class="mt-6 w-full max-w-3xl">
      <div class="rounded-2xl border-2 border-dashed border-skybrand-200/80 bg-white/40 p-5 text-center flex items-center justify-center gap-3 text-xs sm:text-sm text-slate-500">
        <span class="text-base">🌱</span>
        <span>邊做邊學持續上線中...</span>
      </div>
    </div>

  </main>

  <!-- 溫暖頁尾 -->
  <footer class="py-8 text-center text-xs text-slate-400 border-t border-slate-200/60 bg-white/50 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto px-4 space-y-1.5">
      <p class="text-[11px] text-slate-400 font-mono">堅持進化 • 靜待開花 © 2026</p>
    </div>
  </footer>

  <!-- 成果清單（只放資料）：新增成果請改 works.js，不要改這份檔案 -->
  <script src="works.js"></script>
  <!-- 版面產生器：負責把清單排成卡片，平常不需要修改 -->
  <script>
    // 配色表：每種配色都寫完整的 class 名稱，Tailwind 才認得
    const THEMES = {
      blue: {
        glow: "bg-blue-500/5 group-hover:bg-blue-500/10",
        iconBox: "bg-blue-50 border border-blue-100",
        badge: "bg-blue-100/80 text-blue-700 border border-blue-200",
        hoverText: "group-hover:text-blue-600",
        arrowHover: "group-hover:text-blue-600",
        footText: "text-blue-600"
      },
      amber: {
        glow: "bg-amber-500/5 group-hover:bg-amber-500/10",
        iconBox: "bg-amber-50 border border-amber-100",
        badge: "bg-amber-100/80 text-amber-800 border border-amber-200",
        hoverText: "group-hover:text-amber-600",
        arrowHover: "group-hover:text-amber-600",
        footText: "text-amber-700"
      },
      emerald: {
        glow: "bg-emerald-500/5 group-hover:bg-emerald-500/10",
        iconBox: "bg-emerald-50 border border-emerald-100",
        badge: "bg-emerald-100/80 text-emerald-800 border border-emerald-200",
        hoverText: "group-hover:text-emerald-600",
        arrowHover: "group-hover:text-emerald-600",
        footText: "text-emerald-700"
      },
      violet: {
        glow: "bg-violet-500/5 group-hover:bg-violet-500/10",
        iconBox: "bg-violet-50 border border-violet-100",
        badge: "bg-violet-100/80 text-violet-700 border border-violet-200",
        hoverText: "group-hover:text-violet-600",
        arrowHover: "group-hover:text-violet-600",
        footText: "text-violet-700"
      }
    };

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function cardHtml(w) {
      const t = THEMES[w.theme] || THEMES.blue;
      return `
      <a href="${esc(w.url)}"
         class="card-hover group bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-7 border border-slate-200/90 shadow-sm flex flex-col justify-between relative overflow-hidden">

        <div class="absolute top-0 right-0 w-32 h-32 ${t.glow} rounded-full blur-2xl transition"></div>

        <div>
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-2xl ${t.iconBox} flex items-center justify-center text-2xl shadow-sm">
              ${esc(w.icon)}
            </div>
            <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${t.badge}">
              ${esc(w.badge)}
            </span>
          </div>

          <h2 class="text-lg sm:text-xl font-bold text-slate-900 ${t.hoverText} transition flex items-center gap-1.5">
            ${esc(w.title)}
            <svg class="w-4 h-4 text-slate-400 ${t.arrowHover} group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </h2>

          <p class="mt-2.5 text-xs sm:text-sm text-slate-600 leading-relaxed">
            ${esc(w.desc)}
          </p>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-semibold ${t.footText}">
          <span>${esc(w.tags)}</span>
          <span class="flex items-center gap-1">${esc(w.cta)} ➔</span>
        </div>
      </a>`;
    }

    function renderWorks() {
      const box = document.getElementById("works");
      const list = Array.isArray(window.WORKS) ? window.WORKS : null;
      if (!list) {
        box.innerHTML = '<p class="md:col-span-2 text-center text-sm text-slate-500">成果清單載入失敗，請稍後再試。</p>';
        return;
      }
      box.innerHTML = list.map(function (w, i) {
        if (!w || !/^https:\/\//i.test(String(w.url || ""))) {
          console.warn("works.js 第 " + (i + 1) + " 筆沒有有效的 https:// 網址，已略過");
          return "";
        }
        return cardHtml(w);
      }).join("");
    }

    renderWorks();
  </script>

</body>
</html>
