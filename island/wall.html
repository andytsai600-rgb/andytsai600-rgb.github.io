<style>

/* ---------- 取得資料 ---------- */
function demoQueue(){ try{ return JSON.parse(localStorage.getItem('ganen_demo_queue')||'[]'); }catch(e){ return []; } }
async function load(){
  if (!CONFIG.SUBMIT_URL){
    $('#demoFlag').hidden = false;
    const real = demoQueue().filter(r => r.status === '通過').map(toPublic);
    items = SAMPLES.concat(real); return;
  }
  try{
    const r = await fetch(CONFIG.SUBMIT_URL + '?action=wall'); const j = await r.json();
    items = (j && j.ok) ? j.items : [];
  }catch(e){ items = []; }
}
function toPublic(r){ return { kind: r.kind, to: r.kind==='teacher' ? r.to : '', give: r.give, text: (r.kind==='wish'?'':r.content), reflect: r.reflect, wish: r.wish, date: day(r.date) }; }

/* ---------- 畫面 ---------- */
function openDlg(title, body, color){ $('#dt').textContent = title; $('#dh').style.background = color; $('#db').innerHTML = body; $('#dlg').showModal(); }
$('#dx').onclick = () => $('#dlg').close();
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });

function viewThanks(){
  const list = items.filter(i => KIND[i.kind] && (filter==='all' || i.kind===filter));
  let h = '<div class="bar">' + [['all','全部'],['peer','給同學'],['teacher','給老師'],['family','給家長']].map(c => '<button class="chip" data-f="'+c[0]+'" aria-pressed="'+(filter===c[0])+'">'+c[1]+'</button>').join('') + '</div>';
  if (!list.length) return h + '<div class="empty">還沒有被老師放上牆的感恩卡。<br>從島上寫下第一句好話吧！</div>';
  h += '<div class="notes">' + list.map((i,n) => '<article class="note '+i.kind+'" style="--r:'+(((n*37)%7)-3)+'deg" data-n="'+items.indexOf(i)+'">'+(i.demo?'<span class="tag-demo">範例</span>':'')+'<h3>給'+KIND[i.kind]+(i.to?'：'+esc(i.to):'')+'</h3><p>'+esc(i.text)+'</p><time>'+esc(day(i.date))+'</time></article>').join('') + '</div>';
  return h;
}
function viewGive(){
  const list = items.filter(i => i.kind==='give');
  const cnt = k => list.filter(i => GIVE[i.give]===k).length;
  let h = '<div class="counts">' + ['信心','歡喜','希望','方便'].map(k => '<div class="count g-'+k+'"><b>'+cnt(k)+'</b>給人'+k+'</div>').join('') + '</div>';
  if (!list.length) return h + '<div class="empty">四給牆還是空的。想想今天可以為誰做一件小事？</div>';
  return h + '<div class="goods">' + list.map(i => '<article class="good g-'+(GIVE[i.give]||'歡喜')+'" data-n="'+items.indexOf(i)+'"><h3>'+esc(i.give)+(i.demo?'　（範例）':'')+'</h3><p>'+esc(i.text)+'</p><time>'+esc(day(i.date))+'</time></article>').join('') + '</div>';
}
const BCOL = ['#ef4444','#f59e0b','#22a55b','#3b82f6','#a855f7','#ec4899','#14b8a6','#f97316'];
function balloonSVG(c){ return '<svg viewBox="0 0 120 160"><ellipse cx="60" cy="58" rx="50" ry="56" fill="'+c+'"/><ellipse cx="42" cy="36" rx="14" ry="22" fill="#fff" opacity=".22" transform="rotate(-25 42 36)"/><path d="M52 112h16l-4 9h-8z" fill="'+c+'" stroke="rgba(0,0,0,.2)" stroke-width="1"/><path d="M54 121l-4 18M66 121l4 18" stroke="#6b4a2b" stroke-width="1.5"/><rect x="48" y="139" width="24" height="15" rx="3" fill="#c98a4b" stroke="#8a5a2b"/></svg>'; }
function viewSky(){
  const list = items.filter(i => i.kind==='wish');
  if (!list.length) return '<div class="empty">天空還很空。寫下反省與期許，熱氣球就會升起來。</div>';
  const w = Math.max(320, Math.min(1500, innerWidth - 28)), colW = 150, cols = Math.max(2, Math.floor(w / colW)), rowH = 190, rows = Math.ceil(list.length / cols);
  let h = '<div class="sky" style="height:'+Math.max(460,rows*rowH+80)+'px">';
  for (let c=0;c<Math.max(3,rows);c++) h += '<div class="cloud" style="left:'+((c*37)%80)+'%;top:'+(c*rowH+30)+'px"></div>';
  h += list.map((i,n) => { const r = Math.floor(n/cols), cc = n%cols, x = cc*(w/cols) + ((n*53)%30), y = r*rowH + ((n*29)%36) + 12;
    return '<button class="balloon" style="left:'+x+'px;top:'+y+'px;--d:'+(5+(n%5))+'s;--l:-'+(n%7)+'s" data-n="'+items.indexOf(i)+'" aria-label="期許：'+esc(i.wish)+'">'+balloonSVG(BCOL[n%BCOL.length])+'<span>'+esc(i.wish)+'</span></button>'; }).join('');
  return h + '</div>';
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===tab));
  const v = $('#view');
  if (tab==='thanks') v.innerHTML = viewThanks(); else if (tab==='give') v.innerHTML = viewGive(); else if (tab==='sky') v.innerHTML = viewSky(); else return renderTeacher();
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.tab; render(); });
$('#view').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f){ filter = f.dataset.f; render(); return; }
  const el = e.target.closest('[data-n]'); if (!el) return; const i = items[+el.dataset.n]; if (!i) return;
  if (i.kind==='wish') openDlg('🎈 我的期許', '<div class="big">'+esc(i.wish)+'</div><h4>我的反省</h4>'+esc(i.reflect)+'<h4>'+esc(day(i.date))+(i.demo?'　（範例資料）':'')+'</h4>', '#7c3aed');
  else if (i.kind==='give') openDlg('🌈 '+esc(i.give), esc(i.text), '#d98200');
  else openDlg('💗 給'+KIND[i.kind]+(i.to?'：'+i.to:''), esc(i.text), '#d6307f');
});

/* ---------- 老師審核（只有 ?teacher=1 才出現） ---------- */
async function api(obj){ const r = await fetch(CONFIG.SUBMIT_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)}); return r.json(); }
async function loadAll(){
  if (!CONFIG.SUBMIT_URL && !demoQueue().length){ all = SAMPLE_REVIEW.map(r => Object.assign({}, r)); return {ok:true}; }
  if (!CONFIG.SUBMIT_URL){ all = demoQueue().map((r,i) => ({row:i, seat:r.seat, kind:r.kind||'', to:r.to||'', give:r.give||'', content:r.content, event:r.event||'', reflect:r.reflect||'', wish:r.wish||'', date:r.date, status:r.status||'待審核'})).reverse(); return {ok:true}; }
  const j = await api({action:'list', pass}); if (j && j.ok) all = j.rows; return j;
}
async function setStatus(row, status){
  if (!CONFIG.SUBMIT_URL && !demoQueue().length) return {ok:true};
  if (!CONFIG.SUBMIT_URL){ const q = demoQueue(); if (q[row]) q[row].status = status; localStorage.setItem('ganen_demo_queue', JSON.stringify(q)); return {ok:true}; }
  return api({action:'setStatus', pass, row, status});
}
function sheetHTML(r){
  const ev = String(r.event || ''); const m = ev.match(/^【事發日期】([^\n]*)\n?([\s\S]*)$/); const evDate = m ? m[1] : '', evText = m ? m[2] : ev;
  return '<section class="sheet"><h2>反省與期許　家長・老師簽名單</h2><div class="sub2">807三好四給｜感恩島・反思島・四給島　請孩子帶回家，和家長聊一聊，簽名後交回</div>'+
   '<table><tr><th>座號</th><td>'+esc(r.seat)+'</td><th>送出日期</th><td>'+esc(day(r.date))+'</td></tr><tr><th>事情發生的日期</th><td colspan="3">'+esc(evDate)+'</td></tr></table>'+
   '<table><tr><th>事發經過</th><td class="txt">'+esc(evText)+'</td></tr><tr><th>我的反省</th><td class="txt">'+esc(r.reflect)+'</td></tr><tr><th>我的期許</th><td class="txt">'+esc(r.wish)+'</td></tr></table>'+
   '<table class="sign"><tr><th>家長簽名</th><td></td><th>日期</th><td></td></tr><tr><th>任課老師簽名<br><small>（事情發生在課堂時）</small></th><td></td><th>日期</th><td></td></tr><tr><th>導師簽名</th><td></td><th>日期</th><td></td></tr></table>'+
   '<div class="snote">這張單子含有孩子的個人反省內容，請妥善保管，不要拍照或轉傳。</div></section>';
}
function printSheets(rows){
  if (!rows.length) return;
  $('#printArea').innerHTML = rows.map(sheetHTML).join('');
  setTimeout(() => { window.print(); }, 50);
}
addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });
async function renderTeacher(){
  const v = $('#view');
  if (!pass && CONFIG.SUBMIT_URL){
    v.innerHTML = '<div class="tp"><div class="login"><input id="pw" type="password" placeholder="老師密碼" autocomplete="off"><button class="tool" id="go">登入</button></div><div id="lerr" class="empty" style="padding:10px"></div></div>';
    $('#go').onclick = async () => { pass = $('#pw').value; const j = await loadAll(); if (j && j.ok) renderTeacher(); else { pass=''; $('#lerr').textContent = '密碼不對，或後台尚未設定老師密碼。'; } };
    return;
  }
  if (!all.length) await loadAll();
  const st = ['待審核','已讀','通過','退回'];
  let h = '<div class="tp"><div class="bar"><button class="tool" id="printAll" type="button">🖨 列印全部反思簽名單（'+all.filter(r => r.kind==="wish").length+' 張）</button></div><p class="sub" style="text-align:center">只有「通過」的內容會出現在牆上。紅色框是<b>事發經過（保密）</b>，不會上牆。'+(CONFIG.SUBMIT_URL?'':'（示範模式：沒有試送內容時，先顯示幾筆範例；這台裝置試送的內容會取代範例）')+'</p>';
  if (!all.length) h += '<div class="empty">目前沒有送出的內容。</div>';
  h += all.map(r => '<section class="review"><div class="meta">座號：'+esc(r.seat)+'　｜　'+esc(KN[r.kind]||r.kind||'')+(r.to?'・給'+esc(r.to):'')+(r.give?'・'+esc(r.give):'')+'　｜　'+esc(r.date)+'<span class="st">'+esc(r.status)+'</span></div>'+
    (r.kind==='wish' ? '<div class="priv"><b>事發經過（保密）</b>\n'+esc(r.event||r.content)+'</div><div class="txt"><b>反省：</b>'+esc(r.reflect)+'</div><div class="txt"><b>期許（球上的字）：</b>'+esc(r.wish)+'</div>' : '<div class="txt">'+esc(r.content)+'</div>')+
    '<div class="btns">'+st.map(s => '<button data-row="'+r.row+'" data-s="'+s+'" class="'+(r.status===s?'on'+(s==='退回'?' no':''):'')+'">'+s+'</button>').join('')+(r.kind==='wish'?'<button class="pr" data-print="'+r.row+'" type="button">🖨 列印簽名單</button>':'')+'</div></section>').join('') + '</div>';
  v.innerHTML = h;
  const pa = $('#printAll'); if (pa) pa.onclick = () => printSheets(all.filter(r => r.kind==='wish'));
  v.querySelectorAll('[data-print]').forEach(b => b.onclick = () => printSheets(all.filter(r => String(r.row)===b.dataset.print)));
  v.querySelectorAll('.btns button[data-s]').forEach(b => b.onclick = async () => { const j = await setStatus(+b.dataset.row, b.dataset.s); if (j && j.ok){ const r = all.find(x => x.row===+b.dataset.row); if (r) r.status = b.dataset.s; renderTeacher(); load().then(()=>{}); } });
}

$('#fs').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen());
if (TEACHER) $('#tabT').hidden = false;
if (params.get('tab')) tab = params.get('tab');
load().then(render);
if (CONFIG.SUBMIT_URL) setInterval(() => { if (tab!=='teacher' && !$('#dlg').open) load().then(render); }, 60000);
addEventListener('resize', () => { if (tab==='sky') render(); });
</script>
